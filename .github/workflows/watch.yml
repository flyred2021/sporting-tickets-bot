name: Sporting tickets watch

on:
  schedule:
    - cron: "2-59/5 * * * *"   # every 5 min, offset from :00 (busy minutes get delayed/dropped by GitHub)
  workflow_dispatch:         # lets you run it manually from the Actions tab

permissions:
  contents: write            # only used by the monthly keepalive commit

concurrency:
  group: sporting-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # State lives in the Actions cache, not in the repo, so no site content is published.
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: sporting-state-${{ github.run_id }}
          restore-keys: sporting-state-

      - name: Check site
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          DISCORD_MENTION: ${{ vars.DISCORD_MENTION }}
          MODALITIES: ${{ vars.MODALITIES }}
        run: python watch.py

      - name: Save state
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: sporting-state-${{ github.run_id }}

      # GitHub disables cron workflows after 60 days without commits in public repos.
      - name: Keepalive
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 45 * 86400 )) ]; then
            git config user.name  "sporting-watch-bot"
            git config user.email "sporting-watch-bot@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
